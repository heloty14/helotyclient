name: build-win32
on:
  push:
  workflow_dispatch:

jobs:
  win32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build mingw-w64 python3 && sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix && sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

      - name: Get ddnet-libs
        run: if [ ! -d ddnet-libs/sdl ]; then rm -rf ddnet-libs; git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs; fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: i686-pc-windows-gnu

      - name: Configure
        run: export CC=i686-w64-mingw32-gcc-posix CXX=i686-w64-mingw32-g++-posix && cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw32.toolchain -DCMAKE_BUILD_TYPE=Release -DSERVER=OFF -DTOOLS=OFF -DTEST=OFF

      - name: Build
        run: cmake --build build -j4

      - name: Find output
        run: find build -name "*.exe" -o -name "*.dll" | head -50

      - name: Collect files
        run: mkdir -p out && find build -maxdepth 2 \( -name "*.exe" -o -name "*.dll" \) -exec cp {} out/ \; ; cp -r data out/data ; ls out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: helotyclient-win32
          path: out
          if-no-files-found: warn
