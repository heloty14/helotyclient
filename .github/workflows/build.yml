name: build-win32
on:
  push:
  workflow_dispatch:

jobs:
  win32:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build mingw-w64 python3

      - name: Get ddnet-libs
        run: |
          if [ ! -d ddnet-libs/sdl ]; then
            rm -rf ddnet-libs
            git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2
          targets: i686-pc-windows-gnu

      - name: Configure
        run: |
          export CC=i686-w64-mingw32-gcc-posix
          export CXX=i686-w64-mingw32-g++-posix
          if [ -f cmake/toolchains/mingw32.toolchain ]; then
            cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw32.toolchain -DCMAKE_BUILD_TYPE=Release -DSERVER=OFF -DTOOLS=OFF -DTEST=OFF
          else
            cmake -S . -B build -G Ninja -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_BUILD_TYPE=Release -DSERVER=OFF -DTOOLS=OFF -DTEST=OFF
          fi

      - name: Build
        run: cmake --build build -j2

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: helotyclient-win32
          path: |
          build/*.exe
          build/*.dll
