name: build-win32
on:
  push:
  workflow_dispatch:

jobs:
  win32:
    runs-on: ubuntu-24.04
    env:
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
      CC_i686_win7_windows_gnu: i686-w64-mingw32-gcc-posix
      CXX_i686_win7_windows_gnu: i686-w64-mingw32-g++-posix
      AR_i686_win7_windows_gnu: i686-w64-mingw32-ar
      CARGO_TARGET_I686_WIN7_WINDOWS_GNU_LINKER: i686-w64-mingw32-g++-posix
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build mingw-w64 python3 && sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix && sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

      - name: Get ddnet-libs
        run: if [ ! -d ddnet-libs/sdl ]; then rm -rf ddnet-libs; git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs; fi

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Switch to Win7 Rust target
        run: grep -rl "i686-pc-windows-gnu" cmake CMakeLists.txt | xargs -r sed -i 's/i686-pc-windows-gnu/i686-win7-windows-gnu/g' ; grep -rn "windows-gnu" cmake CMakeLists.txt | head -20

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw32.toolchain -DCMAKE_BUILD_TYPE=Release -DSERVER=OFF -DTOOLS=OFF -DTEST=OFF

      - name: Build
        run: cmake --build build -j4

      - name: Collect files
        run: mkdir -p out && find build -maxdepth 2 \( -name "*.exe" -o -name "*.dll" \) -exec cp {} out/ \; ; cp -r data out/data ; ls out
        
      - name: Check Win8 imports
        run: for f in out/*.exe out/*.dll; do echo "== $f"; i686-w64-mingw32-objdump -p "$f" | grep -i "api-ms-win" || true; done

      - name: Find who uses WaitOnAddress
        run: i686-w64-mingw32-objdump -p out/DDNet.exe | grep -i -A8 "api-ms-win-core-synch" || true ; for f in build/i686-win7-windows-gnu/release/*.a /usr/lib/gcc/i686-w64-mingw32/13-posix/*.a /usr/i686-w64-mingw32/lib/*.a; do if i686-w64-mingw32-nm "$f" 2>/dev/null | grep -q WaitOnAddress; then echo "USES $f"; fi; done
        
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: helotyclient-win32
          path: out
          if-no-files-found: warn
