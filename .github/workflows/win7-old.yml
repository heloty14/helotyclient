5name: win7-old
on:
  push:
  workflow_dispatch:

env:
  DDNET_TAG: "18.9"

jobs:
  win32:
    runs-on: ubuntu-22.04
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build mingw-w64 python3 git && sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix && sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

      - name: List DDNet tags
        run: git ls-remote --tags --refs https://github.com/ddnet/ddnet | sed 's|.*refs/tags/||' | sort -V | tail -40

      - name: Get DDNet source
        run: git clone --depth 1 --branch $DDNET_TAG https://github.com/ddnet/ddnet.git ddnet-src && cd ddnet-src && git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs && (ls Cargo.toml || echo "NO RUST IN THIS VERSION")

      - name: Install Rust 1.77.2
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2
          targets: i686-pc-windows-gnu

      - name: Configure
        working-directory: ddnet-src
        run: (sed -i 's/RUST_MSRV "[0-9.]*"/RUST_MSRV "1.77.0"/' cmake/FindRust.cmake || true) && (if [ -f cmake/toolchains/mingw32.toolchain ]; then cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw32.toolchain -DCMAKE_BUILD_TYPE=Release -DSERVER=OFF -DTOOLS=OFF -DTEST=OFF; else cmake -S . -B build -G Ninja -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc-posix -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++-posix -DCMAKE_BUILD_TYPE=Release -DSERVER=OFF -DTOOLS=OFF -DTEST=OFF; fi)

      - name: Build
        working-directory: ddnet-src
        run: cmake --build build -j4

      - name: Collect files
        working-directory: ddnet-src
        run: mkdir -p out && find build -maxdepth 2 \( -name "*.exe" -o -name "*.dll" \) -exec cp {} out/ \; ; cp -r data out/data ; ls out

      - name: Check Win8 imports
        working-directory: ddnet-src
        run: i686-w64-mingw32-objdump -p out/DDNet.exe | grep -i "api-ms-win" || echo "OK, no Win8 imports"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-win7
          path: ddnet-src/out
