name: win7-build
on:
  push:
    branches: [win7]
  workflow_dispatch:

jobs:
  win32:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build mingw-w64 python3 git && sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix && sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

      - name: Check sources and libs
        run: if [ ! -d ddnet-libs/sdl ]; then rm -rf ddnet-libs; git clone --depth 1 https://github.com/ddnet/ddnet-libs.git ddnet-libs; fi && ls && (ls Cargo.toml || echo "NO RUST IN THIS VERSION") && ls src/game/client/components | head -5

      - name: Add Heloty menu
        run: bash patch.sh .

      - name: Configure
        run: if [ -f cmake/toolchains/mingw32.toolchain ]; then cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw32.toolchain -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-U__STRICT_ANSI__ -DCMAKE_CXX_FLAGS=-U__STRICT_ANSI__ -DSERVER=OFF -DTOOLS=OFF -DTEST=OFF; else cmake -S . -B build -G Ninja -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc-posix -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++-posix -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-U__STRICT_ANSI__ -DCMAKE_CXX_FLAGS=-U__STRICT_ANSI__ -DSERVER=OFF -DTOOLS=OFF -DTEST=OFF; fi

      - name: Build
        run: cmake --build build -j4 -- -k 0 || (cmake --build build -j1 -- -k 0 2>&1 | grep -B2 -A6 "error" | head -200; exit 1)

      - name: Collect files
        run: mkdir -p out && find build -maxdepth 2 \( -name "*.exe" -o -name "*.dll" \) -exec cp {} out/ \; ; cp -r data out/data ; ls out

      - name: Check Win8 imports
        run: i686-w64-mingw32-objdump -p out/DDNet.exe | grep -i "api-ms-win" || echo "OK, no Win8 imports"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-win7
          path: out
